<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force Calendar</title>

<!-- ⭐ ホーム画面アイコン対応 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #fff;
    color: #000;
  }

  .page {
    display: none;
    padding: 20px;
    position: relative;
  }

  /* ⭐ ロック画面風パスコード入力 */
  #passcodeDisplay {
    font-size: 40px;
    letter-spacing: 10px;
    text-align: center;
    margin: 30px 0;
  }

  /* ⭐ 数字ボタン（統一デザイン） */
  .passcode-btn {
    width: 90px;
    height: 90px;
    margin: 12px;
    border-radius: 50%;
    background: #e5e5e5;
    font-size: 32px;
    border: none;
    box-shadow: 0 3px 6px rgba(0,0,0,0.35);
    cursor: pointer;
  }

  .passcode-btn:active {
    background: #ccc;
  }

  /* ⭐ ボタン全体をグリッドで配置（ズレない鉄壁レイアウト） */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    justify-items: center;
    align-items: center;
    max-width: 360px;
    margin: 0 auto;
  }

  /* ⭐ 解除ボタン（中央・大きめ） */
  #unlockBtn {
    display: block;
    margin: 30px auto 0 auto;
    font-size: 26px;
    padding: 16px 40px;
    border-radius: 14px;
    border: none;
    background: #007aff;
    color: #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  /* ⭐ 左下のフォースカード（透明度0.5） */
  #forceHint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 16px;
    color: rgba(0,0,0,0.5);
  }

  /* 年ビューなどは省略（前回と同じ） */
</style>
</head>

<body>

<!-- ⭐ 1：パスコード入力画面 -->
<div id="forcePage" class="page" style="display:block;">
  <h1 style="text-align:center;">パスコード入力</h1>

  <div id="passcodeDisplay">・・・・</div>

  <!-- ⭐ グリッド方式の鉄壁レイアウト -->
  <div class="keypad">

    <!-- 1段目 -->
    <button class="passcode-btn" onclick="pressNum(1)">1</button>
    <button class="passcode-btn" onclick="pressNum(2)">2</button>
    <button class="passcode-btn" onclick="pressNum(3)">3</button>

    <!-- 2段目 -->
    <button class="passcode-btn" onclick="pressNum(4)">4</button>
    <button class="passcode-btn" onclick="pressNum(5)">5</button>
    <button class="passcode-btn" onclick="pressNum(6)">6</button>

    <!-- 3段目 -->
    <button class="passcode-btn" onclick="pressNum(7)">7</button>
    <button class="passcode-btn" onclick="pressNum(8)">8</button>
    <button class="passcode-btn" onclick="pressNum(9)">9</button>

    <!-- ⭐ 4段目（1〜9と同じ構造） -->
    <button class="passcode-btn" onclick="pressYen()">￥</button>
    <button class="passcode-btn" onclick="pressNum(0)">0</button>
    <button class="passcode-btn" onclick="deleteNum()">⌫</button>

  </div>

  <button id="unlockBtn" onclick="unlock()">解除</button>

  <!-- ⭐ 左下にフォースカード -->
  <div id="forceHint"></div>
</div>


<script>
  let forceSuit = "";
  let forceNumber = "";
  let forceCard = "";
  let passcode = "";

  const suitMap = {
    "01": "♦",
    "02": "♣",
    "03": "♥",
    "04": "♠"
  };

  const numMap = {
    "01": "A", "02": "2", "03": "3", "04": "4", "05": "5",
    "06": "6", "07": "7", "08": "8", "09": "9", "10": "10",
    "11": "J", "12": "Q", "13": "K"
  };

  /* ⭐ ￥ボタンは内部的に 0 として扱う */
  function pressYen() {
    pressNum(0);
  }

  /* ⭐ 数字入力処理（4桁目でフォースカード表示） */
  function pressNum(n) {
    if (passcode.length < 4) {
      passcode += n;
      updatePasscodeDisplay();

      if (passcode.length === 4) {
        const suitCode = passcode.slice(0,2);
        const numCode = passcode.slice(2,4);

        forceSuit = suitMap[suitCode] || "♠";
        forceNumber = numMap[numCode] || "A";
        forceCard = forceSuit + forceNumber;

        document.getElementById("forceHint").textContent = forceCard;
      }
    }
  }

  function deleteNum() {
    if (passcode.length > 0) {
      passcode = passcode.slice(0, -1);
      updatePasscodeDisplay();
    }
  }

  function updatePasscodeDisplay() {
    let dots = passcode.split("").map(() => "●").join("");
    while (dots.length < 4) dots += "・";
    document.getElementById("passcodeDisplay").textContent = dots;
  }

  function unlock() {
    if (passcode.length !== 4) return;
    showPage("yearPage");
    generateYearView();
  }

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(id).style.display = "block";
  }

  /* 年ビュー・月ビューは前回と同じなので省略 */
</script>

</body>
</html>

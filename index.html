<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force Calendar</title>
<link rel="manifest" href="manifest.json">

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #000;
    color: #fff;
    text-align: center;
  }

  /* 共通ボタン */
  button {
    padding: 14px 22px;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    background: #ffffff;
    color: #333;
    margin: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  /* ページ非表示制御 */
  .page {
    display: none;
    padding: 20px;
  }

  /* 最終ページの背景（水色＋星パターン） */
  #finalPage {
    background: #aee6ff;
    background-image: radial-gradient(#ffffff 2px, transparent 2px),
                      radial-gradient(#ffffff 2px, transparent 2px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    min-height: 100vh;
    color: #333;
  }

  /* iOS風 月選択ボタン */
  .month-buttons button {
    width: 90px;
    padding: 12px;
    margin: 8px;
    border-radius: 12px;
    border: none;
    background: #ffffff;
    color: #333;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.1s ease;
  }

  .month-buttons button:active {
    transform: scale(0.95);
  }

  /* カレンダー表示 */
  #calendarArea {
    margin-top: 20px;
    font-size: 22px;
  }
</style>
</head>

<body>

<!-- ページ1：スタート -->
<div id="startPage" class="page" style="display:block;">
  <h1>Force Calendar</h1>
  <button onclick="goToDayPage()">演技へ進む</button>
</div>

<!-- ページ2：日の選択 -->
<div id="dayPage" class="page">
  <h2>誕生日の日を選んでください</h2>
  <div id="dayButtons"></div>
</div>

<!-- ページ3：月選択＋カレンダー -->
<div id="finalPage" class="page">
  <h2 id="currentYear"></h2>

  <div class="month-buttons">
    <button data-month="1">1月</button>
    <button data-month="2">2月</button>
    <button data-month="3">3月</button>
    <button data-month="4">4月</button>
    <button data-month="5">5月</button>
    <button data-month="6">6月</button>
    <button data-month="7">7月</button>
    <button data-month="8">8月</button>
    <button data-month="9">9月</button>
    <button data-month="10">10月</button>
    <button data-month="11">11月</button>
    <button data-month="12">12月</button>
  </div>

  <div id="calendarArea"></div>
</div>

<script>
  let selectedDay = null;

  /* ページ遷移 */
  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(id).style.display = "block";
  }

  function goToDayPage() {
    showPage("dayPage");
  }

  function goToFinalPage() {
    showPage("finalPage");
  }

  /* 日ボタン生成 */
  const dayButtons = document.getElementById("dayButtons");
  for (let i = 1; i <= 31; i++) {
    const btn = document.createElement("button");
    btn.textContent = i + "日";
    btn.onclick = () => {
      selectedDay = i;
      goToFinalPage();
    };
    dayButtons.appendChild(btn);
  }

  /* 現在の年を表示 */
  document.getElementById("currentYear").textContent =
    new Date().getFullYear() + "年";

  /* 月選択ボタン → カレンダー生成 */
  document.querySelectorAll(".month-buttons button").forEach(btn => {
    btn.addEventListener("click", () => {
      const month = parseInt(btn.dataset.month);
      generateCalendar(month);
    });
  });

  /* カレンダー生成（簡易版） */
  function generateCalendar(month) {
    const year = new Date().getFullYear();
    const firstDay = new Date(year, month - 1, 1).getDay();
    const lastDate = new Date(year, month, 0).getDate();

    let html = `<h3>${year}年 ${month}月</h3><table style="margin:auto;font-size:20px;">`;
    html += "<tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr><tr>";

    for (let i = 0; i < firstDay; i++) html += "<td></td>";

    for (let d = 1; d <= lastDate; d++) {
      let style = "";
      if (d === selectedDay) {
        style = "background:#ffeb3b;color:#000;font-weight:bold;border-radius:8px;";
      }
      html += `<td style="${style}">${d}</td>`;
      if ((d + firstDay) % 7 === 0) html += "</tr><tr>";
    }

    html += "</tr></table>";
    document.getElementById("calendarArea").innerHTML = html;
  }
</script>

</body>
</html>
